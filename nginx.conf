# /etc/nginx/nginx.conf

# 有关配置的更多信息, 请参阅:
#   * 官方英语文档: http://nginx.org/en/docs/
#   * 官方俄语文档: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

# 加载动态模块, 请参见 /usr/share/doc/nginx/README.dynamic
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # 从 /etc/nginx/conf.d 目录加载模块化配置文件
    # 参考 http://nginx.org/en/docs/ngx_core_module.html#include 获取更多信息
    include /etc/nginx/conf.d/*.conf;

    server {
        # 使用HTTP时重定向到HTTPS，如果server_name为域名则此处使用$server_name替换$host(IP相关)
        return 301 https://$host$request_uri;

        # # 启用本机验证方式
        # auth_basic "User Authentication";
        # # 修改使用 htpasswd 命令生成用户名/密码的文件路径
        # auth_basic_user_file /usr/local/nginx-1.10.2/conf/pass.db;
    }

# 启用 TLS 的服务器的设置

    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        server_name  _;
        root         /usr/share/nginx/html;

        ssl_certificate "/etc/pki/nginx/server_76_53_189_212.pem";
        ssl_certificate_key "/etc/pki/nginx/private/server_76_53_189_212.key";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        # ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

        # 加载默认服务器模块的配置文件
        include /etc/nginx/default.d/*.conf;

        location /download {
            # 使用Nginx自带模块开启目录索引
            # autoindex             on;
            # 显示文件大小 KB,MB,GB
            # autoindex_exact_size  off;
            # 显示本机时间
            # autoindex_localtime   on;

            # 以下为使用第三方模块进行序列号文件下载服务器的模块设置
            sub_filter 'File Name' '文件名称';
            sub_filter 'File Size' '文件大小';
            sub_filter 'Date' '日期';
            sub_filter 'Parent directory' '父目录';
            # 使用第三方模块进行目录索引，功能更强大
            fancyindex              on;
            # 不显示精确大小
            fancyindex_exact_size   off;
            # 文件日期显示格式
            fancyindex_time_format "%Y-%m-%d %H:%M:%S";
            # 使用用户本地时间显示
            fancyindex_localtime    on;
            # 自定义主题
            # 页面头
            fancyindex_header "/theme/Nginx-Fancyindex-Theme/Nginx-Fancyindex/header.html";
            # 页面尾
            fancyindex_footer "/theme/Nginx-Fancyindex-Theme/Nginx-Fancyindex/footer.html";

            # 忽略的文件夹/文件
            fancyindex_ignore "theme";

            # 解决中文显示乱码问题
            charset utf-8;
            # 对于匹配中的文件类型，以附件形式下载而不是浏览
            # if ($request_filename ~* ^.*?\.(txt|jpg|png)$) {
            #     add_header Content-Disposition 'attachment';
            # }
       }

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }
}
