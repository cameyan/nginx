name: Nginx RPM 构建与发布

# 触发条件
on:
  push:
    tags:
      # 推送名为 v* tag 时触发
      - 'v*'

permissions:
  # 赋予创建 Release 和上传资产的权限
  contents: write

# 任务工作流
jobs:
  build-and-release:
    name: 构建 RPM 并发布
    # 宿主机环境
    runs-on: ubuntu-latest

    # 使用 fedora:44 容器镜像构建
    container:
      image: fedora:44

    steps:
      # 步骤 1
      - name: 检出代码
        uses: actions/checkout@v5

      # 步骤 2
      - name: 安装构建环境基础组件
        run: |
          dnf install -y rpm-build rpmdevtools dnf-plugins-core gcc make perl

      # 步骤 3
      - name: 准备构建源码
        run: |
          rpmdev-setuptree

          cp -a * "$HOME/rpmbuild/SOURCES/"
          cp -a nginx.spec "$HOME/rpmbuild/SPECS/"

      # 步骤 4
      - name: 安装构建依赖并开始构建
        run: |

          dnf builddep -y "$HOME/rpmbuild/SPECS/nginx.spec"

          rpmbuild --noclean -ba "$HOME/rpmbuild/SPECS/nginx.spec"

      # 步骤 5
      - name: 收集构建产物
        run: |
          mkdir dist_rpm
          find "$HOME/rpmbuild/RPMS/" -type f -name "*.rpm" -exec cp -a {} dist_rpm/ \;
          find "$HOME/rpmbuild/SRPMS/" -type f -name "*.src.rpm" -exec cp -a {} dist_rpm/ \;

      # 步骤 6
      - name: 创建并发布 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body: |
            GitHub Actions 自动化构建信息:
            - 标签: `${{ github.ref_name }}`
            - 镜像: fedora:44
            - 架构: x86_64 (x64)
          draft: false
          prerelease: false
          # 待发布的产物
          files: |
            dist_rpm/*
